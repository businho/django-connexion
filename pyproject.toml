[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-connexion"
version = "0.0.3"
description = "Django connexion extension for Connexion 3.x"
readme = "README.md"
requires-python = ">=3.8"
license-files = ["LICENSE"]
authors = [{ name = "Iuri de Silvio", email = "iurisilvio@gmail.com" }]
maintainers = [{ name = "Thiago Avelino", email = "avelinorun@gmail.com" }]
keywords = ["django", "connexion", "openapi", "swagger"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["connexion>=3.2.0", "django>=3.2"]

[project.urls]
Homepage = "https://github.com/buserbrasil/django-connexion"
Repository = "https://github.com/buserbrasil/django-connexion"
Issues = "https://github.com/buserbrasil/django-connexion/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-django", "pytest-runner", "flake8"]
test = ["pytest", "pytest-cov", "pytest-django", "flake8"]

[tool.setuptools.packages.find]
include = ["django_connexion*"]

[tool.setuptools.package-data]
"*" = ["*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_connexion.tests.testapp.settings"
addopts = "--nomigrations --cov=django_connexion --cov-report html --cov-report term --cov-report xml --cov-fail-under=49"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.flake8]
max-line-length = 88

[tool.coverage.run]
source = ["django_connexion"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
